name: Flower Contribution Garden

on:
  schedule:
    - cron: "0 3 * * *"   
  workflow_dispatch:        
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar jardim de flores
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_flower_garden.py

      - name: Commitar SVG atualizado
        run: |
          git config user.name "flower-garden-bot"
          git config user.email "actions@github.com"
          git add assets/flower-garden.svg
          git diff --staged --quiet || git commit -m "🌸 atualiza jardim de flores"
          git push